<!doctype html>
<!-- GENERATED by tools/pages.py from site/. Edit site/ and run `npm run pages`, not this file. -->
<html lang="fil" data-page="{{page}}">
<head>

  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#02030a">
  <link rel="canonical" href="{{url}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ReSpecz PC Builder">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{site}}assets/og/{{page}}.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fil_PH">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{root}}assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://down-ph.img.susercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}styles.css">
{{head_extra}}</head>
<body>
  <a class="skip" href="#main">Lumaktaw sa content</a>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{root}}" aria-label="ReSpecz PC Builder, home">
        <img src="{{root}}assets/rs-logo-nav.webp" alt="" width="44" height="28">
        <span>PC Builder</span>
      </a>
      <nav class="nav-links" aria-label="Mga page">
{{nav_links}}
      </nav>
      <button class="nav-basket" id="nav-basket" type="button" aria-label="Buksan ang Basket">

    </div>
  </header>

  <main id="main" class="page page-{{page}}">
{{main}}
{{disclosure}}  </main>

  </footer>

  <!-- mobile: one tap to every page -->
  <nav class="tabbar" aria-label="Mga page">
{{tabbar}}
  </nav>

{{dialogs}}  <script type="module" src="{{root}}js/app.js"></script>
